[project]
name = "arxiv-mcp"
version = "0.1.0"
description = "MCP server: fast arXiv search + full-text extraction, no API keys"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "evangit2" }]
keywords = ["mcp", "arxiv", "search", "academic"]
dependencies = ["fastmcp>=2"]

[project.scripts]
arxiv-mcp = "arxiv_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
